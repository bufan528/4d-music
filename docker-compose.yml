# 四维声乐后端 docker-compose 配置
# 使用方法：docker compose up -d --build
# 注：顶层 version 字段已废弃，Compose V2 不再需要声明

services:
  4d-vocal-backend:
    build: .
    container_name: 4d-vocal-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # LLM 配置（可选，不填则 AI 点评显示"未连接"）
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-}
      # 可选：设置后 /analyze 接口需要携带 x-api-token 请求头，防止被滥用刷 LLM 额度
      - API_TOKEN=${API_TOKEN:-}
      # 【安全】允许跨域调用的前端域名，多个用逗号分隔；不填则允许所有来源（不推荐）
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - PORT=8000
    volumes:
      # 持久化处理后的音频文件（可选，调试用）
      - ./processed:/app/processed
      - ./uploads:/app/uploads
      # 持久化排行榜数据，避免重建容器丢失
      # 注意：宿主机 ./leaderboard.json 文件必须存在（touch 一个 {} 文件），
      # 否则 Docker 会创建一个同名目录导致 EISDIR 启动问题
      - ./leaderboard.json:/app/leaderboard.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 内存限制（DTW 带状改造后，1G 内存足够）
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
